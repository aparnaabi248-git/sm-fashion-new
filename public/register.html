<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SM Fashion</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-container {
      max-width: 500px;
      margin: 4rem auto;
      padding: 2rem;
      background: var(--color-white);
      box-shadow: var(--shadow-sm);
      border-top: 4px solid var(--color-gold);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="logo">SM FASHION</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="/">Home</a></li>
        <li><a href="/products.html">Shop</a></li>
        <li id="authLink"><a href="/login.html">Login</a></li>
        <li>
          <a href="/cart.html" class="cart-icon">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-count" id="cartCount">0</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="auth-container">
      <h2 class="text-center mb-2">Create Account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="address">Delivery Address</label>
          <textarea id="address" class="form-control" rows="3"></textarea>
        </div>
        <!-- Secret check to make a user admin, strictly for testing purposes if desired -->
        <!-- <input type="checkbox" id="isAdmin"> Make Admin -->
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>
      <p class="text-center mt-1">
        Already have an account? <a href="/login.html" style="color:var(--color-gold)">Sign In</a>
      </p>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const address = document.getElementById('address').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, address })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('userInfo', JSON.stringify(data));
          window.location.href = '/';
        } else {
          alert(data.message || 'Registration failed');
        }
      } catch (err) {
        alert('An error occurred');
      }
    });
  </script>
</body>
</html>
