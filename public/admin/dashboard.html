<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | SM Fashion</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <a href="/" class="brand">SM FASHION</a>
      <nav class="admin-nav">
        <a href="/admin/dashboard.html" class="active"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a href="/admin/products.html"><i class="fas fa-box"></i> Products</a>
        <a href="/admin/orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a href="/admin/support.html"><i class="fas fa-headset"></i> Support Requests</a>
        <a href="#" onclick="logout(event)" style="margin-top: 2rem;"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
      <div class="admin-header">
        <h2>Dashboard Overview</h2>
        <div id="adminUser">Admin User</div>
      </div>

      <div class="dashboard-cards">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-box"></i></div>
          <div class="stat-info">
            <h3>Total Products</h3>
            <div class="stat-value" id="totalProducts">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-shopping-bag"></i></div>
          <div class="stat-info">
            <h3>Total Orders</h3>
            <div class="stat-value" id="totalOrders">0</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-rupee-sign"></i></div>
          <div class="stat-info">
            <h3>Total Sales</h3>
            <div class="stat-value" id="totalSales">0</div>
          </div>
        </div>
      </div>

      <!-- Recent Orders Quick View -->
      <h3 class="mb-1">Recent Orders</h3>
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Customer Name</th>
            <th>Date</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="recentOrdersTable">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const userInfo = getUserInfo();
      if (!userInfo || !userInfo.isAdmin) {
        window.location.href = '/login.html';
        return;
      }
      document.getElementById('adminUser').innerText = userInfo.name;

      try {
        const headers = { 'Authorization': `Bearer ${getToken()}` };
        
        // Fetch Products Count
        const prodRes = await fetch('/api/products');
        const products = await prodRes.json();
        document.getElementById('totalProducts').innerText = products.length;

        // Fetch Orders for sales and count
        const orderRes = await fetch('/api/orders', { headers });
        const orders = await orderRes.json();
        
        document.getElementById('totalOrders').innerText = orders.length;
        
        // Calculate total sales (only delivered/shipped/processing/pending, maybe exclude cancelled)
        const validOrders = orders.filter(o => o.status !== 'Cancelled');
        const totalSales = validOrders.reduce((acc, order) => acc + order.totalAmount, 0);
        document.getElementById('totalSales').innerText = `Rs. ${totalSales.toLocaleString()}`;

        // Render Recent Orders
        const tbl = document.getElementById('recentOrdersTable');
        if(orders.length === 0) {
          tbl.innerHTML = '<tr><td colspan="5">No orders found.</td></tr>';
        } else {
          tbl.innerHTML = orders.slice(0, 5).map(o => `
            <tr>
              <td>${o._id.substring(18)}</td>
              <td>${o.userId ? o.userId.name : 'Unknown User'}</td>
              <td>${new Date(o.date).toLocaleDateString()}</td>
              <td>Rs. ${o.totalAmount}</td>
              <td><span class="status-badge status-${o.status}">${o.status}</span></td>
            </tr>
          `).join('');
        }

      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
